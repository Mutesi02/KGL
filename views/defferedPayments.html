<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deferred Payments | Karibu Groceries Ltd</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="/bootstrap-5.3.5-dist/css/bootstrap.css">
    <link rel="stylesheet" href="/bootstrap-5.3.5-dist/js/bootstrap.js">

  <!-- My CSS -->
  <link rel="stylesheet" href="../css/deferred-payments.css" />
  <link rel="stylesheet" href="styles.css" />

</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Karibu Groceries Ltd</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="offcanvas offcanvas-end" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">KGL</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="produce-procurement.html">Produce Procurement</a></li>
            <li class="nav-item"><a class="nav-link" href="stock.html">Stock</a></li>
            <li class="nav-item"><a class="nav-link" href="deffered-payments.html">Deferred Payments</a></li>
            <li class="nav-item"><a class="nav-link" href="sales.html">Sales</a></li>
            <li class="nav-item"><a class="nav-link" href="manager-dashboard.html">Manager's Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="contacts.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container mt-5 pt-5">
    <section class="mb-5">
      <h2 class="text-center mb-4">Deferred Payment Plan</h2>
      <div class="card p-4 shadow-sm">
        <div class="row mb-3">
          <div class="col-md-4"><strong>Total Cost:</strong> UGX 2,000,000</div>
          <div class="col-md-4"><strong>Deposit Paid:</strong> UGX 1,500,000</div>
          <div class="col-md-4"><strong>Remaining:</strong> UGX 500,000</div>
        </div>
        <div>
          <progress class="w-100" value="75" max="100"></progress>
          <p class="text-center mt-2">75% Paid</p>
        </div>
        <div class="text-center mt-4">
          <button class="btn btn-success me-2">💳 Pay Now</button>
          <button class="btn btn-outline-primary">🗓️ Set Up Payment Plan</button>
        </div>
      </div>
    </section>

    <section class="mb-5">
      <h3 class="mb-3">Record Trusted Buyer Information</h3>
      <form id="buyerForm" class="row g-3 needs-validation" novalidate>
        <div class="col-md-6">
          <label for="buyerName" class="form-label">Buyer Name</label>
          <input type="text" class="form-control" id="buyerName" required placeholder="Enter name" />
        </div>

        <div class="col-md-6">
          <label for="nationalId" class="form-label">National ID</label>
          <input type="text" class="form-control" id="nationalId" pattern="\d{3}-\d{4}-\d{3}" required placeholder="Enter ID e.g. 123-4567-890" />
        </div>

        <div class="col-md-6">
          <label for="location" class="form-label">Location</label>
          <input type="text" class="form-control" id="location" required />
        </div>

        <div class="col-md-6">
          <label for="contacts" class="form-label">Contact Number</label>
          <input type="tel" class="form-control" id="contacts" required />
        </div>

        <div class="col-md-6">
          <label for="amountDue" class="form-label">Amount Due (UGX)</label>
          <input type="number" class="form-control" id="amountDue" min="10000" required />
        </div>

        <div class="col-md-6">
          <label for="salesAgent" class="form-label">Sales Agent</label>
          <input type="text" class="form-control" id="salesAgent" required />
        </div>

        <div class="col-md-6">
          <label for="dueDate" class="form-label">Due Date</label>
          <input type="date" class="form-control" id="dueDate" required />
        </div>

        <div class="col-md-6">
          <label for="produceName" class="form-label">Produce Name</label>
          <input type="text" class="form-control" id="produceName" required />
        </div>

        <div class="col-md-6">
          <label for="produceType" class="form-label">Produce Type</label>
          <input type="text" class="form-control" id="produceType" required />
        </div>

        <div class="col-md-6">
          <label for="tonnage" class="form-label">Tonnage</label>
          <input type="number" class="form-control" id="tonnage" required />
        </div>

        <div class="col-md-6">
          <label for="dispatchDate" class="form-label">Dispatch Date</label>
          <input type="date" class="form-control" id="dispatchDate" required />
        </div>

        <div class="col-12 text-center">
          <button class="btn btn-primary mt-3" type="submit">Submit</button>
        </div>
      </form>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="/bootstrap-5.3.5-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
