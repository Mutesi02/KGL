<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
         <title>Sales Form</title>
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
         <link rel="stylesheet" href="/css/sales.css">
     </head> ` 
     <body>
         <div class="container mt-5">
             <h1 class="text-center mb-4">Sales Produce</h1>
             <form action="/sales" class="p-4 shadow-lg rounded bg-light" id="myForm" onsubmit="ValidityForm(event)">
                 <div class="mb-3">
                     <label for="Pname" class="form-label">Produce Name:</label>
                     <input type="text" id="Pname" name="Pname" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="Tproduce" class="form-label">Type of Produce:</label>
                     <input type="text" id="Tproduce" name="Tproduce" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="datePicker" class="form-label">Date of Sale:</label>
                     <input type="date" id="datePicker" name="Dsale" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="timePicker" class="form-label">Time of Sale:</label>
                     <input type="time" id="timePicker" name="Tsale" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="Qsold" class="form-label">Quantity Sold (kg):</label>
                     <input type="text" id="Qsold" name="Qsold" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="Sprice" class="form-label">Unit Price per kg:</label>
                     <input type="text" id="Sprice" name="uprice" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="Tamount" class="form-label">Total Amount:</label>
                     <input type="text" id="Tamount" name="Tamount" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="customerName" class="form-label">Customer Name:</label>
                     <input type="text" id="customerName" name="customerName" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="customerContact" class="form-label">Customer Contact:</label>
                     <input type="text" id="customerContact" name="customerContact" class="form-control">
                 </div>
     
                 <div class="mb-3">
                     <label for="autoSizingSelect" class="form-label">Payment Method:</label>
                     <select class="form-select" id="autoSizingSelect" name="paymentMethod">
                         <option selected>Choose...</option>
                         <option value="Cash">Cash</option>
                         <option value="Mobile Money">Mobile Money</option>
                         <option value="Bank Transfer">Bank Transfer</option>
                     </select>
                 </div>
                 <button type="submit" class="btn btn-primary w-100">Submit</button>
             </form>
         </div>
     
         <!-- Bootstrap JS -->
         <script src="sales.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
     </body>
     </html>
